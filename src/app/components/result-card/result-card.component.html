<article class="result-card" dir="rtl">
  <header class="result-heading">
    <div class="result-title">
      <span class="result-heading-label">نتيجة البحث</span>
      <strong>{{ documentIdentifier }}</strong>
    </div>
    <button class="header-action" type="button" *ngIf="hit.source_url || hit.document_url" (click)="openDocument()">
      فتح الوثيقة <span aria-hidden="true">↗</span>
    </button>
  </header>
  <dl class="metadata" *ngIf="fields.length">
    <div class="metadata-row" *ngFor="let field of fields">
      <dt>{{ fieldLabel(field) }}</dt>
      <dd>{{ valueFor(field) }}</dd>
    </div>
  </dl>
  <p class="source-context" *ngIf="sourceFile || sourcePage">
    <span class="source-pill" *ngIf="sourceFile">{{ sourceFile }}</span>
    <span class="source-pill" *ngIf="sourcePage">الصفحة {{ sourcePage }}</span>
  </p>
  <p class="snippet" *ngIf="hit.snippet?.text">{{ hit.snippet?.text }}</p>
</article>
